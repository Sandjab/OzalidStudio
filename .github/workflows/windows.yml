# Établit que Windows compile, teste et pagine comme macOS, puis produit sur tag
# l'installeur NSIS. L'app n'est testable sous Windows que par ici : c'est le second
# volet du jalon 5 (docs/superpowers/specs/2026-08-20-release-windows-ci-design.md).
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # La compilation Rust d'un projet Tauri dépasse largement le reste du job ; sans
      # cache, chaque push coûterait une dizaine de minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Le sidecar et les polices ne sont pas versionnés. La clé porte les scripts
      # eux-mêmes : relever la version épinglée de Typst ou changer la liste des polices
      # invalide le cache, ce qui est le comportement voulu.
      - name: Cache du sidecar et des polices
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/fonts
          key: typst-polices-${{ hashFiles('outils/typst.sh', 'outils/polices.sh') }}

      - name: Sidecar Typst et polices embarquées
        run: |
          outils/typst.sh x86_64-pc-windows-msvc
          outils/polices.sh

      # `temoin` et `packager` prennent le Typst du PATH, comme en local : la CI ne se
      # donne pas une procédure à elle.
      - name: Typst dans le PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cp src-tauri/binaries/typst-x86_64-pc-windows-msvc.exe "$RUNNER_TEMP/bin/typst.exe"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Version de Typst
        run: typst --version

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      # `-D warnings` en plus de la commande du README : en local un avertissement se
      # lit, ici personne ne lit le journal d'un job vert.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --lib

      - name: Tests du front
        run: node --test "tests/*.test.js"

      # L'assertion centrale du volet : la pagination ne dépend pas de la plateforme.
      - name: Témoin de pagination
        working-directory: src-tauri
        run: cargo run --example temoin -- "$RUNNER_TEMP/temoin"

  publier:
    needs: verifier
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Une release dont le numéro ment sur son contenu est pire que pas de release.
      - name: Le tag et la version de l'application doivent coïncider
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf" ]; then
            echo "tag $GITHUB_REF_NAME contre version $conf de tauri.conf.json" >&2
            exit 1
          fi
          echo "version $conf"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache du sidecar et des polices
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/fonts
          key: typst-polices-${{ hashFiles('outils/typst.sh', 'outils/polices.sh') }}

      - name: Sidecar Typst et polices embarquées
        run: |
          outils/typst.sh x86_64-pc-windows-msvc
          outils/polices.sh

      - name: CLI Tauri
        run: npm install -g @tauri-apps/cli@^2

      - name: Construire l'installeur
        working-directory: src-tauri
        run: tauri build --bundles nsis

      # Un installeur qui s'installe n'est pas un installeur qui compose : commands.rs
      # cherche le sidecar à côté de l'exécutable et les polices dans son sous-dossier
      # `fonts`, mais rien ne garantit encore que le NSIS les y pose vraiment. On installe
      # en silencieux et on inspecte l'arborescence réelle plutôt que de la supposer.
      #
      # En PowerShell, et non en bash : `Start-Process -Wait` attend l'installeur seul,
      # là où bash attend aussi l'application que celui-ci lance en fin d'installation —
      # un premier essai a tourné 1 h 40 sur cette seule ligne. `-PassThru` donne en
      # prime le code de sortie de l'installeur, sans lequel un échec est muet.
      - name: Vérifier l'installation silencieuse
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dossier = "src-tauri/target/release/bundle/nsis"
          $installeur = Get-ChildItem $dossier -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installeur) {
            Write-Error "aucun installeur trouvé sous $dossier"
            exit 1
          }

          $p = Start-Process -FilePath $installeur.FullName -ArgumentList "/S" -Wait -PassThru
          Write-Host "installeur terminé, code de sortie $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Write-Error "l'installation silencieuse a échoué"
            exit 1
          }

          # L'application que l'installeur vient de lancer tient ses fichiers ouverts.
          Get-Process -Name "ozalid-studio" -ErrorAction SilentlyContinue | Stop-Process -Force

          # L'exécutable porte le nom du paquet Cargo — « ozalid-studio.exe » — et non le
          # `productName`, qui ne nomme que le bundle et le dossier d'installation. Le mode
          # NSIS de Tauri installe par utilisateur (%LOCALAPPDATA%) ou par machine
          # (%PROGRAMFILES%) : on cherche aux deux endroits plutôt que d'en supposer un.
          $racines = @($env:LOCALAPPDATA, $env:ProgramFiles)
          $trouve = Get-ChildItem $racines -Recurse -Depth 2 -Filter "ozalid-studio.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trouve) {
            Write-Host "répertoires de $env:LOCALAPPDATA :"
            Get-ChildItem $env:LOCALAPPDATA -Directory | ForEach-Object { $_.Name }
            Write-Error "« ozalid-studio.exe » introuvable : l'installeur a rendu 0 sans rien poser"
            exit 1
          }

          $racine = $trouve.Directory.FullName
          Write-Host "racine d'installation : $racine"
          Get-ChildItem $racine -Recurse -Depth 1 | ForEach-Object { $_.FullName }

          if (-not (Test-Path (Join-Path $racine "typst.exe"))) {
            Write-Error "typst.exe absent de $racine : commands.rs::binaire_typst() le cherche à côté de l'exécutable, l'installeur ne l'y a pas posé."
            exit 1
          }
          if (-not (Get-ChildItem (Join-Path $racine "fonts") -Filter "*.ttf" -ErrorAction SilentlyContinue)) {
            Write-Error "aucun .ttf dans $racine\fonts : commands.rs::typst() n'y trouvera pas de polices."
            exit 1
          }

          Write-Host "sidecar et polices trouvés à leur emplacement attendu"

      - name: Construire l'archive portable
        run: outils/portable.sh

      # Une archive qui se déplie n'est pas une archive qui range ses réglages à côté
      # d'elle. On interroge le binaire réellement livré, par son propre code, plutôt
      # que de faire confiance à un test qui simulerait la même logique ailleurs.
      #
      # `--emplacement` écrit dans un fichier et non sur la sortie standard : l'exécutable
      # est compilé en `windows_subsystem = "windows"`, il n'a aucune console rattachée
      # et un `println!` ne serait lu par personne.
      - name: Vérifier que l'archive est portable
        shell: pwsh
        timeout-minutes: 5
        run: |
          $zip = Get-ChildItem "src-tauri/target/portable" -Filter "*-portable.zip" |
            Select-Object -First 1
          if (-not $zip) { Write-Error "aucune archive portable produite"; exit 1 }

          $depliage = Join-Path $env:RUNNER_TEMP "portable"
          Expand-Archive -Path $zip.FullName -DestinationPath $depliage -Force
          $racine = (Get-ChildItem $depliage -Directory | Select-Object -First 1).FullName
          Write-Host "déplié dans $racine"
          Get-ChildItem $racine -Recurse -Depth 1 | ForEach-Object { $_.FullName }

          # Les deux mêmes contrôles que sur l'installation silencieuse : le sidecar à
          # côté de l'exécutable, les polices dans leur sous-dossier.
          if (-not (Test-Path (Join-Path $racine "typst.exe"))) {
            Write-Error "typst.exe absent de $racine : commands.rs::binaire_typst() le cherche à côté de l'exécutable, l'archive ne l'y a pas posé."
            exit 1
          }
          if (-not (Get-ChildItem (Join-Path $racine "fonts") -Filter "*.ttf" -ErrorAction SilentlyContinue)) {
            Write-Error "aucun .ttf dans $racine\fonts : commands.rs::typst() n'y trouvera pas de polices."
            exit 1
          }

          $rapport = Join-Path $env:RUNNER_TEMP "emplacement.txt"
          $p = Start-Process -FilePath (Join-Path $racine "ozalid-studio.exe") `
            -ArgumentList "--emplacement", $rapport -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "le drapeau --emplacement a rendu $($p.ExitCode)"
            exit 1
          }
          $lu = Get-Content $rapport -Raw
          Write-Host $lu

          $attendue = Join-Path $racine "donnees"
          # La ligne entière, ancrée. « portable\b » passerait sur
          # « mode = portable-lecture-seule » — le tiret est une frontière de mot — et la
          # CI validerait une archive qui n'enregistre rien.
          if ($lu -notmatch "(?m)^mode = portable$") {
            Write-Error "l'archive ne se reconnaît pas portable : $lu"
            exit 1
          }
          if ($lu -notmatch [regex]::Escape($attendue)) {
            Write-Error "racine attendue « $attendue », rapport : $lu"
            exit 1
          }
          Write-Host "l'archive range ses réglages dans $attendue"

      - name: Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" | head -1)
          [ -n "$exe" ] || { echo "aucun installeur produit" >&2; exit 1; }
          zip=$(find src-tauri/target/portable -name "*-portable.zip" | head -1)
          [ -n "$zip" ] || { echo "aucune archive portable produite" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$exe" "$zip" \
            --draft \
            --title "Ozalid Studio $GITHUB_REF_NAME" \
            --notes "Deux façons de l'installer.

          **L'installeur \`.exe\`** — la voie normale. L'installation ne demande pas de droits administrateur.

          **L'archive \`-portable.zip\`** — à déplier où l'on veut, y compris sur une clé USB. Elle n'installe rien et garde ses réglages dans le dossier « donnees » qu'elle crée à côté d'elle ; deux postes différents y retrouvent les mêmes maquettes. Deux réserves : elle ne peut pas installer le composant **WebView2** dont l'application a besoin — présent d'origine sur Windows 11 et sur un Windows 10 à jour, à défaut de quoi il faut passer par l'installeur — et Windows marque les fichiers extraits d'une archive téléchargée : faire « Propriétés » puis « Débloquer » sur le zip **avant** de l'extraire.

          Rien n'est signé : au premier lancement, Windows affiche « Windows a protégé votre PC ». Choisir « Informations complémentaires », puis « Exécuter quand même »."
