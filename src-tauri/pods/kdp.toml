# Amazon KDP — la documentation technique la plus complète du marché : gabarits de
# manuscrit officiels et formules de dos publiées.
#
# Sa contrepartie est commerciale : imprimer oblige à publier, et l'épreuve privée sort
# filigranée.

cle = "kdp"
nom = "Amazon KDP"
# Page d'aide « Create a Paperback Cover » : 0,125 po. Commun à ses formats.
fond_perdu = 3.175

# Les seize formats partagent marges et gouttières, et ce n'est pas une extrapolation
# depuis le 6 × 9 : les dix-sept modèles Word officiels portent les mêmes valeurs au
# centième de millimètre près — 12,7 mm en haut, en bas et à l'extérieur, 19,05 mm en
# gouttière. La gouttière est le plus grand des deux gabarits publiés : les 19,05 mm du
# modèle de manuscrit, sauf au-delà de 700 pages où le minimum de la tranche (0,875 po)
# passe devant.
#
# Les dimensions viennent des pouces, pas des centimètres arrondis que KDP affiche à côté
# d'eux : le 8,27 × 11,69 po fait 210,06 × 296,93 mm et non l'A4 rond dont il s'approche.
#
# Cinq formats portent un plafond de pages propre, parce que KDP publie le sien par
# couple format × papier là où nous croisons trois axes indépendants. Le plafond écrit
# ici est celui du crème, le plus bas des deux : il tombe alors juste en crème, et le
# blanc se sous-borne — de 50 pages sur le 8,25 × 6, de 40 sur les 8,5. Sous-borner
# refuse un livre que l'imprimeur aurait pris ; sur-promettre ferait composer un dos pour
# un livre qu'il refusera. Le test qui porte la table publiée de KDP, dans `package.rs`,
# garde cet arbitrage — et un format ajouté ici sans son plafond l'y fait échouer.
#
# Deux absences volontaires. Le **8,25 × 11 po** a son modèle Word et figure au tableau du
# fond perdu, mais le tableau des paginations du broché ne le porte pas — il n'y est qu'en
# relié. Sans bornes publiées, on refuse plutôt que d'inventer. Et les neuf formats de
# kdp.amazon.co.jp ne sont pas ici : c'est un autre marketplace, où la couleur standard
# n'existe pas et où les paginations diffèrent — un POD à lui, pas des formats de plus.

[[format]]
cle = "5x8"
nom = "5 × 8 po"
mm = { largeur = 127.0, hauteur = 203.2 }
marges = { haut = 12.7, bas = 12.7, exterieur = 12.7 }
gouttieres = [ { de = 24, a = 700, mm = 19.05 }, { de = 701, a = 828, mm = 22.23 } ]
source = "modèles Word officiels et tableau des minimums"

