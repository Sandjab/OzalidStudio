[[reliure]]
cle = "broche"
nom = "Broché — dos carré collé"
geometrie = "dos-carre-colle"
pages = { min = 24, max = 828 }
# Aucune règle de parité relevée chez KDP ; « paire » est ce que la composition fait
# partout.
parite = "paire"
source = "options d'impression KDP"

# KDP : deux papiers noir et blanc, définitifs après publication (page d'aide « Create a
# Paperback Cover »). Aucun terme additif — l'épaisseur de la couverture n'entre pas dans
# le calcul, contrairement à Lulu et BoD.
[[papier]]
cle = "creme"
nom = "Crème"
teinte = "#f7f0e0"
dos = { forme = "multiplie", par = 0.0635, plus = 0.0 }
# Le crème plafonne sous le blanc partout : 776 pages contre 828 sur la plupart des
# formats, et il descend avec eux sur les cinq qui plafonnent plus bas. C'est ce
# plafond-ci qui tombe juste format par format ; celui du blanc, lui, se sous-borne là où
# le format le resserre — la table de KDP croise le format et le papier, nos trois axes
# les tiennent pour indépendants. On sous-borne plutôt que de sur-promettre.
pages = { min = 24, max = 776 }
source = "« Create a Paperback Cover » — 0,0025 po, 280 p → 17,78 mm ; plafond 776 p"

[[papier]]
cle = "blanc"
nom = "Blanc"
teinte = "#ffffff"
dos = { forme = "multiplie", par = 0.0572, plus = 0.0 }
source = "page d'aide « Create a Paperback Cover » — 0,002252 po, 280 p → 16,02 mm"
