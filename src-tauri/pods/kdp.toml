# Amazon KDP — la documentation technique la plus complète du marché : gabarits de
# manuscrit officiels et formules de dos publiées.
#
# Sa contrepartie est commerciale : imprimer oblige à publier, et l'épreuve privée sort
# filigranée.

cle = "kdp"
nom = "Amazon KDP"
# Page d'aide « Create a Paperback Cover » : 0,125 po. Commun à ses formats.
fond_perdu = 3.175

# Les trois formats partagent marges et gouttières : les modèles Word officiels gardent
# 12,7 mm quel que soit le format de rognage. La gouttière est le plus grand des deux
# gabarits publiés — les 19,05 mm du modèle de manuscrit, sauf au-delà de 700 pages où le
# minimum de la tranche (0,875 po) passe devant.

[[format]]
cle = "5x8"
nom = "5 × 8 po"
cle_heritee = "kdp-5x8"
mm = { largeur = 127.0, hauteur = 203.2 }
marges = { haut = 12.7, bas = 12.7, exterieur = 12.7 }
gouttieres = [ { de = 24, a = 700, mm = 19.05 }, { de = 701, a = 828, mm = 22.23 } ]
source = "modèles Word officiels et tableau des minimums"

[[format]]
cle = "55x85"
nom = "5,5 × 8,5 po"
cle_heritee = "kdp-55x85"
mm = { largeur = 139.7, hauteur = 215.9 }
marges = { haut = 12.7, bas = 12.7, exterieur = 12.7 }
gouttieres = [ { de = 24, a = 700, mm = 19.05 }, { de = 701, a = 828, mm = 22.23 } ]
source = "modèles Word officiels et tableau des minimums"

[[format]]
cle = "6x9"
nom = "6 × 9 po"
cle_heritee = "kdp-6x9"
mm = { largeur = 152.4, hauteur = 228.6 }
marges = { haut = 12.7, bas = 12.7, exterieur = 12.7 }
gouttieres = [ { de = 24, a = 700, mm = 19.05 }, { de = 701, a = 828, mm = 22.23 } ]
source = "modèles Word officiels et tableau des minimums"

[[reliure]]
cle = "broche"
nom = "Broché — dos carré collé"
geometrie = "dos-carre-colle"
pages = { min = 24, max = 828 }
# Aucune règle de parité relevée chez KDP ; « paire » est ce que la composition fait
# partout.
parite = "paire"
source = "options d'impression KDP"

# KDP : deux papiers noir et blanc, définitifs après publication (page d'aide « Create a
# Paperback Cover »). Aucun terme additif — l'épaisseur de la couverture n'entre pas dans
# le calcul, contrairement à Lulu et BoD.
[[papier]]
cle = "creme"
nom = "Crème"
teinte = "#f7f0e0"
dos = { forme = "multiplie", par = 0.0635, plus = 0.0 }
source = "page d'aide « Create a Paperback Cover » — 0,0025 po, 280 p → 17,78 mm"

[[papier]]
cle = "blanc"
nom = "Blanc"
teinte = "#ffffff"
dos = { forme = "multiplie", par = 0.0572, plus = 0.0 }
source = "page d'aide « Create a Paperback Cover » — 0,002252 po, 280 p → 16,02 mm"
