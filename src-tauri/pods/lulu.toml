[[reliure]]
cle = "broche"
nom = "Broché — dos carré collé"
geometrie = "dos-carre-colle"
pages = { min = 32, max = 800 }
# Aucune règle de parité relevée chez Lulu ; « paire » est ce que la composition fait
# partout.
parite = "paire"
source = "guide : « Paperback books require a minimum of 32 interior pages » ; 800 au maximum, feuille de spécifications"

# Lulu relie en dur de trois façons — pleine toile, pelliculée, jaquette — et publie une
# table de dos pour chacune. La géométrie est donc relevable, mais `planche` ne sait pas
# la composer : une couverture rigide déborde du livre, se replie à l'intérieur des plats
# et se monte sur des cartons. La spec range ce chantier hors périmètre.
[[reliure]]
cle = "rigide"
nom = "Couverture rigide"
non_outille = "planche ne sait pas composer une couverture rigide : ni rempli, ni mors, ni cartons"

# Deux pelliculages, sur toutes les couvertures brochées. Aucun n'a d'effet sur la
# composition : la finition nomme une option de commande, et le livrable en garde la trace.
[[finition]]
cle = "mat"
nom = "Pelliculage mat"

[[finition]]
cle = "brillant"
nom = "Pelliculage brillant"

# Les trois papiers du broché ont la **même** épaisseur publiée — 444 pages par pouce —,
# donc le même dos : pages / 17,48 + 1,524 mm, où 17,48 = 444 / 25,4 et 1,524 mm = 0,06 po
# de carton de couverture. Ce n'est pas une simplification : c'est ce que le générateur de
# gabarit rend, papier par papier, et ce que la table du calculateur officiel publie.
# La division est gardée telle que le guide l'écrit — la convertir en facteur décimal
# introduirait une dérive.
#
# Deux autres épaisseurs existent chez Lulu — 460 pour le couché 70 lb des magazines, 200
# pour le couché 100 lb — mais aucun produit broché ne les porte : hors table.
#
# La clé `standard` est historique : c'est celle que portent les projets déjà enregistrés.

[[papier]]
cle = "standard"
nom = "Blanc non couché 60 lb"
teinte = "#ffffff"
dos = { forme = "divise", par = 17.48, plus = 1.524 }
source = "guide, formule du broché ; 444 pages/pouce ; vérifié au gabarit — 244 p → 15,48 mm"

[[papier]]
cle = "creme-60"
nom = "Crème non couché 60 lb"
teinte = "#f7f0e0"
dos = { forme = "divise", par = 17.48, plus = 1.524 }
source = "feuille de spécifications, 060UC444 — même épaisseur que le blanc"

[[papier]]
cle = "couche-80"
nom = "Blanc couché 80 lb"
teinte = "#ffffff"
dos = { forme = "divise", par = 17.48, plus = 1.524 }
source = "feuille de spécifications, 080CW444 — même épaisseur que les non couchés"
