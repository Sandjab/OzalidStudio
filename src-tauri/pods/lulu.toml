# Lulu — Raleigh (Caroline du Nord), impression Europe pour les commandes européennes.
#
# Tout ce qui suit est public et sans compte. Quatre sources, toutes rejouables :
#
# 1. Le « Book Creation Guide », `assets.lulu.com/media/guides/en/lulu-book-creation-guide.pdf` :
#    les formats de rognage, la marge de sécurité (0,5 po), la table des ajouts de
#    gouttière, le fond perdu (0,125 po) et la formule de dos du broché.
# 2. La feuille de spécifications officielle, `assets.lulu.com/media/specs/lulu-print-api-spec-sheet.xlsx`
#    (3 277 produits, révision du 21/07/2026) : les dimensions en millimètres, les
#    paginations admises et les papiers, produit par produit.
# 3. Le calculateur du portail développeurs, qui publie en clair l'épaisseur des papiers
#    en pages par pouce : 060UW → 444, 060UC → 444, 080CW → 444, 070CW → 460, 100CW → 200.
# 4. Le générateur de gabarit de couverture, `api.lulu.com/cover/api/v1/template/`, sans
#    authentification : il rend un PDF qui écrit son dos, son fond perdu et sa marge de
#    sécurité en toutes lettres. C'est lui qui ancre les tests, relevé le 27/08/2026.
#
# Lulu rogne en **pouces** : les millimètres de ce fichier sont ceux que Lulu publie
# lui-même (108 × 175), et non la conversion exacte que rend son gabarit (107,95 × 174,62).
# L'écart va jusqu'à 0,5 mm sur le Small Square, en deçà de la tolérance de rognage.
#
# Réserve du COOKBOOK : une maquette qui imite une charte de collection existante reste un
# usage privé — ne pas activer la Retail Distribution avec une couverture de ce genre.

cle = "lulu"
nom = "Lulu"
# Guide, chapitre « Bleed Margin » : 0,125 po sur tous les côtés, tous formats. Le gabarit
# de couverture l'écrit « 0.125” (3.17mm) » ; 3,175 est la valeur exacte du pouce.
fond_perdu = 3.175

# Les marges des seize formats sont **les mêmes** : Lulu ne les module pas par format,
# il publie une marge de sécurité unique de 0,5 po = 12,7 mm, que son gabarit de couverture
# répète à l'identique sur les seize. La gouttière est cette marge plus l'ajout que le
# guide donne par tranche de pagination (chapitre « Gutter Additions ») :
#
#     moins de 60 pages   + 0 po      → 0,5 po    = 12,7 mm
#     61 à 150            + 0,125 po  → 0,625 po  = 15,875 mm
#     151 à 400           + 0,5 po    → 1 po      = 25,4 mm
#     400 à 600           + 0,625 po  → 1,125 po  = 28,575 mm
#     plus de 600         + 0,75 po   → 1,25 po   = 31,75 mm
#
# Deux accidents dans cette table publiée, tranchés ici du côté le plus large — une
# gouttière trop grande coûte des pages, une trop petite fait relier dans le texte :
# la page 60 n'appartient à aucune tranche (« moins de 60 », puis « 61 à 150 ») et lui est
# donnée à la seconde ; la page 400 appartient aux deux (« 151 à 400 » et « 400 à 600 »)
# et lui est donnée à la seconde également.
#
# Les millimètres sont ceux des pouces, pas les arrondis du guide (13, 16, 25, 29, 32) :
# c'est en pouces que Lulu imprime, et son gabarit rend 12,7 et non 13.

[[format]]
cle = "108x175"
nom = "Poche 10,8 × 17,5"
mm = { largeur = 108.0, hauteur = 175.0 }
marges = { haut = 12.7, bas = 12.7, exterieur = 12.7 }
gouttieres = [
  { de = 32, a = 59, mm = 12.7 },
  { de = 60, a = 150, mm = 15.875 },
  { de = 151, a = 399, mm = 25.4 },
  { de = 400, a = 600, mm = 28.575 },
  { de = 601, a = 800, mm = 31.75 },
]
source = "guide, « Pocketbook » 4,25 × 6,875 po ; marges du chapitre « Gutter Additions »"

