[[reliure]]
cle = "broche"
nom = "Broché — dos carré collé"
geometrie = "dos-carre-colle"
pages = { min = 40, max = 750 }
parite = "paire"
source = "leur aide : 40 à 750 pages en dos carré collé, nombre pair"

# TheBookEdition relie aussi en rigide — cinq formats, 24 à 300 pages, et un gabarit
# explicatif à part. La géométrie est relevable, mais `planche` ne sait pas la composer.
[[reliure]]
cle = "rigide"
nom = "Couverture rigide"
non_outille = "planche ne sait pas composer une couverture rigide : ni rempli, ni mors, ni cartons"

# Trois pelliculages sur la couverture 300 g du dos carré collé. Aucun n'a d'effet sur la
# composition : la finition nomme une option de commande, et le livrable en garde la trace.
[[finition]]
cle = "brillant"
nom = "Pelliculage brillant"

[[finition]]
cle = "mat"
nom = "Pelliculage mat"

[[finition]]
cle = "soft-touch"
nom = "Pelliculage soft touch"

# Le dos ne dépend que de la pagination : 0,060 mm par page, quel que soit le papier et
# quel que soit le format. Ce n'est pas une simplification de notre part — c'est ce que
# produit leur générateur de gabarit. Mesuré sur la largeur des gabarits JPEG 300 dpi qu'il
# renvoie, sur les neuf formats × trois papiers × cinq paginations : 40 p → 2,40 mm,
# 100 p → 6,04, 280 p → 16,79, 500 p → 30,00, 750 p → 44,99 — identiques d'un format et
# d'un papier à l'autre à moins de 0,05 mm, l'écart résiduel étant l'arrondi au pixel.
[[papier]]
cle = "munken-80"
nom = "Munken 80 g"
teinte = "#ffffff"
dos = { forme = "multiplie", par = 0.060, plus = 0.0 }
source = "mesuré sur les gabarits JPEG 300 dpi du 27/08/2026"

[[papier]]
cle = "120"
nom = "Papier 120 g"
teinte = "#ffffff"
dos = { forme = "multiplie", par = 0.060, plus = 0.0 }
source = "mesuré sur les gabarits JPEG 300 dpi du 27/08/2026 — même dos que le Munken 80 g"

# Le papier de l'intérieur en couleur : leur module ne le propose qu'avec `id_color=couleur`,
# où il est le seul. Même dos que les deux autres, mesuré de la même façon.
[[papier]]
cle = "135"
nom = "Papier 135 g couleur"
teinte = "#ffffff"
dos = { forme = "multiplie", par = 0.060, plus = 0.0 }
source = "mesuré sur les gabarits JPEG 300 dpi du 27/08/2026 — intérieur couleur"
