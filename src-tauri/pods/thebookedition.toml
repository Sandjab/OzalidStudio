cle = "110x200"
nom = "Romantique 11 × 20"
mm = { largeur = 110.0, hauteur = 200.0 }
marges = { haut = 20.0, bas = 20.0, exterieur = 20.0 }
gouttieres = [ { de = 40, a = 750, mm = 20.0 } ]
source = "leur table des formats ; marges du gabarit Word 11x20cm.doc"

[[format]]
cle = "120x180"
nom = "Manga 12 × 18"
mm = { largeur = 120.0, hauteur = 180.0 }
marges = { haut = 12.5, bas = 12.5, exterieur = 12.5 }
gouttieres = [ { de = 40, a = 750, mm = 17.5 } ]
source = "leur table des formats ; marges de la page « Réussir la mise en page »"

