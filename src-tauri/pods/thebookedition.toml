# TheBookEdition — production française, contrôle manuel des fichiers.
#
# Ils ne publient aucune dimension de couverture : ni fond perdu, ni formule de dos. Tout
# ce qui touche la planche est **mesuré** sur ce que leur générateur rend — un POST sans
# authentification sur `/fr/module/bookscover/simulationcover`, qui renvoie un JPEG 300 dpi.
# Le même module publie en JSON la table de ses formats (`action=GetFormat`) et de ses
# papiers (`action=GetWeight`), reliure par reliure : les neuf formats ci-dessous et leurs
# dimensions en viennent, relevés le 27/08/2026. Leur aide fait du gabarit généré une
# condition de recevabilité : le vérifier contre la planche avant de déposer.
#
# Les neuf formats admis en dos carré collé, cette fois au complet.

cle = "tbe"
nom = "TheBookEdition"
# Mesuré : leur générateur rend une planche haute de la hauteur du livre + 10 mm, sur les
# neuf formats et à toutes les paginations mesurées (40, 100, 280, 500, 750 pages).
fond_perdu = 5.0

# Deux provenances pour les marges, et elles ne s'accordent pas :
#
# — La page « Réussir la mise en page » conseille 12,5 mm sur les quatre côtés plus 5 mm de
#   reliure — d'où 17,5 mm de gouttière — « pour un livre de poche au format 11×17 cm »,
#   mesures qui « conviennent également pour un format A5 » ; et, « pour un grand format
#   comme le A4 », 20 mm sur les quatre côtés plus 6 mm de reliure.
# — Les gabarits Word de `/fr/content/24-gabarits-interieur`, un par format, qui donnent
#   des marges symétriques sans marge de reliure : 20 mm partout, sauf 19 mm latéraux et
#   25,4 mm en tête et en pied au 18 × 26, et 25 mm partout à l'A4.
#
# Chaque format prend la source qui le nomme : la page de conseils pour ceux qu'elle
# traite, le gabarit Word pour les cinq autres. Une marge de reliure ne s'invente pas là
# où l'imprimeur n'en publie pas — le gabarit Word n'en pose aucune, et sa gouttière vaut
# donc sa marge intérieure.
#
# Aucune variation selon la pagination n'est publiée : tranche unique, bornée par les 40 à
# 750 pages que leur dos carré collé admet.

[[format]]
cle = "110x170"
nom = "Poche 11 × 17"
mm = { largeur = 110.0, hauteur = 170.0 }
marges = { haut = 12.5, bas = 12.5, exterieur = 12.5 }
gouttieres = [ { de = 40, a = 750, mm = 17.5 } ]
source = "leur table des formats ; marges de la page « Réussir la mise en page »"

